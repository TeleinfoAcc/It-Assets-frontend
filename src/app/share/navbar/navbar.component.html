<!-- Mobile overlay -->
<div *ngIf="menuOpen" class="fixed inset-0 bg-black/50 z-40 md:hidden" (click)="toggleMenu()"></div>

<!-- Mobile toggle button -->
<button *ngIf="isAdmin || isManager" (click)="toggleMenu()"
    class="fixed top-4 left-4 z-50 md:hidden p-2 rounded-lg bg-[#1e2d4d] text-white shadow-lg">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path *ngIf="!menuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16" />
        <path *ngIf="menuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M6 18L18 6M6 6l12 12" />
    </svg>
</button>

<!-- Sidebar -->
<aside *ngIf="isAdmin || isManager"
    [class]="'fixed top-0 left-0 h-screen w-64 bg-[#1a2744] text-white flex flex-col z-40 transition-transform duration-300 ' + (menuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0')">

    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 py-5 border-b border-white/10">
        <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        </div>
        <div>
            <div class="font-bold text-sm tracking-widest uppercase">Equipment Readiness</div>
            <div class="text-[10px] text-gray-400 tracking-wide">Daily / Weekly / Monthly</div>
        </div>
    </div>

    <!-- Nav Items -->
    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
        <a *ngFor="let item of navItems" [routerLink]="item.path" (click)="menuOpen = false"
            routerLinkActive="bg-blue-600 text-white"
            class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm text-gray-300 hover:bg-white/10 transition-all duration-150">
            <img [src]="item.icon" class="w-5 h-5" alt="{{ item.label }} Icon">
            <span>{{ item.label }}</span>
        </a>
    </nav>

    <!-- User Info + Logout -->
    <div class="px-4 py-4 border-t border-white/10 space-y-3">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gray-500 flex items-center justify-center text-lg flex-shrink-0">
                👤
            </div>
            <div class="flex-1 min-w-0">
                <div class="text-sm font-semibold truncate">{{ agentName }}</div>
                <div class="text-xs text-gray-400">Administrator</div>
            </div>
            <div class="w-2.5 h-2.5 rounded-full bg-green-400 flex-shrink-0"></div>
        </div>
        <button (click)="logout()"
            class="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-sm text-gray-300 hover:bg-red-500/20 hover:text-red-400 transition border border-white/10">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span>ออกจากระบบ</span>
        </button>
    </div>
</aside>
