<div class="p-6">

    <h2 class="text-xl font-semibold text-gray-700 mb-6">Update Asset</h2>

    <form [formGroup]="assetForm" (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Row 1 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Asset Number</label>
                <input type="text" formControlName="it_asset_id" readonly
                    class="w-full h-9 px-3 border border-gray-300 rounded bg-gray-100 text-sm text-gray-500 cursor-not-allowed" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Account Asset Number</label>
                <input type="text" formControlName="gl_asset_code"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Serial Number</label>
                <input type="text" formControlName="serialnumber"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Cap Date</label>
                <input type="date" formControlName="cap_date"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
        </div>

        <!-- Row 2 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Asset Brand</label>
                <input type="text" formControlName="com_brand"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Asset Model</label>
                <input type="text" formControlName="com_model"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
        </div>

        <!-- Row 3 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Computer Name</label>
                <input type="text" formControlName="com_name"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">IP TMC Domain</label>
                <input type="text" formControlName="com_local_ip"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">IP AIS Join Domain</label>
                <input type="text" formControlName="com_join_ip"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
        </div>

        <!-- Row 4 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">WFO/WFH</label>
                <select [(ngModel)]="selectedWfoWfh" [ngModelOptions]="{standalone: true}"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400 bg-white">
                    <option [ngValue]="null">-- เลือก --</option>
                    <option [ngValue]="'WFO'">WFO</option>
                    <option [ngValue]="'WFH'">WFH</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Asset Type</label>
                <select [(ngModel)]="selectedAssetType" [ngModelOptions]="{standalone: true}"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400 bg-white">
                    <option [ngValue]="null">-- เลือก --</option>
                    <option *ngFor="let opt of assetTypeOptions" [ngValue]="opt">{{ opt }}</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Status Asset</label>
                <select [(ngModel)]="selectedAssetStatus" [ngModelOptions]="{standalone: true}"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400 bg-white">
                    <option [ngValue]="null">-- เลือก --</option>
                    <option *ngFor="let opt of statusOptions" [ngValue]="opt.asset_status">{{ opt.asset_status_name }}
                    </option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Current Owner</label>
                <input type="text" formControlName="current_owner"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
        </div>

        <!-- Row 4 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">HDD MAC</label>
                <input type="text" formControlName="hdd_mac"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">SSD MAC</label>
                <input type="text" formControlName="ssd_mac"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Wifi MAC</label>
                <input type="text" formControlName="wifi_mac"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">LAN MAC</label>
                <input type="text" formControlName="lan_mac"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
        </div>

        <!-- Row 5 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">S/N: Adapter</label>
                <input type="text" formControlName="sn_adapter"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">S/N: USB To LAN</label>
                <input type="text" formControlName="sn_usb_lan"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">S/N: Mouse</label>
                <input type="text" formControlName="sn_mouse"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
        </div>

        <!-- Row 6 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>

                <label class="block text-xs text-gray-500 mb-1">Site Name</label>
                <select [(ngModel)]="selectedLocation" (ngModelChange)="onLocationChange()"
                    [ngModelOptions]="{standalone: true}"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400 bg-white">
                    <option [ngValue]="null">-- เลือก --</option>
                    <option *ngFor="let opt of siteOptions" [ngValue]="opt.site_code">{{ opt.site_name }}</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Room Name</label>
                <select [(ngModel)]="selectedRoomCode" [ngModelOptions]="{standalone: true}"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400 bg-white">
                    <option [ngValue]="null">-- เลือก --</option>
                    <option *ngFor="let opt of roomOptions" [ngValue]="opt.room_code">{{ opt.room_name }}</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Seat</label>
                <input type="text" formControlName="seat"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Project Seat</label>
                <select [(ngModel)]="selectedProjectSeat" [ngModelOptions]="{standalone: true}"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400 bg-white">
                    <option [ngValue]="null">-- ไม่ระบุ --</option>
                    <option *ngFor="let opt of projectSeatOptions" [ngValue]="opt">{{ opt }}</option>
                </select>
            </div>
        </div>
        <!-- Row 8 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1">Description 1</label>
                <input type="text" formControlName="com_desc1"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1">Description 2</label>
                <input type="text" formControlName="com_desc2"
                    class="w-full h-9 px-3 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3 pt-2">
            <button type="submit" [disabled]="assetForm.invalid || isSubmitting"
                class="px-6 h-9 bg-blue-500 hover:bg-blue-600 disabled:opacity-50 text-white text-sm font-medium rounded transition-colors flex items-center gap-2">
                @if (isSubmitting) {
                <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
                </svg>
                กำลังบันทึก...
                } @else {
                บันทึก
                }
            </button>
            <button type="button" (click)="onCancel()"
                class="px-6 h-9 border border-gray-300 hover:bg-gray-50 text-gray-600 text-sm font-medium rounded transition-colors">
                ยกเลิก
            </button>
        </div>

    </form>

</div>
